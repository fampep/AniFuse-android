# CI-friendly build profile: enough heap for Gradle + the Kotlin compiler
# daemon, parallel execution on. File watching stays off (an optimization
# only; avoids watcher issues in restricted/containerized environments).
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.vfs.watch=false
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
